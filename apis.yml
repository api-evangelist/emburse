description: >
  Emburse is an expense management and accounts payable automation platform
  serving over 4 million finance leaders and business travelers worldwide.
  The company offers REST APIs across its product lines including Emburse
  Professional (formerly Certify), Emburse Spend (formerly Abacus), and
  Emburse Enterprise (Chrome River), enabling integrations for expense
  reports, corporate card management, invoice processing, receipt capture,
  and reimbursement workflows. The Virtual Cards API provides OAuth2-secured
  endpoints for creating and managing virtual and physical cards, transactions,
  members, and accounting data. Emburse Enterprise exposes Swagger-documented
  APIs for Expense, Invoice, Person, PreApproval, Purchase Order, Vendor, and
  Allocation resources. API access for the Spend product is available to
  Partners and customers on the Plus plan or higher.
tags:
  - Expense Management
  - AP Automation
  - Corporate Cards
  - Virtual Cards
  - Receipt Capture
  - Reimbursement
  - Invoice Processing
  - Finance
  - FinTech
