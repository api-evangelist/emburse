    description: >
      REST API for managing virtual and physical corporate cards, transactions,
      members, accounts, and accounting categories. Uses OAuth2 token-based
      authentication and supports idempotency keys for safe retries.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.emburse.com/api-docs
    baseURL: https://api.emburse.com/v1/
    tags:
