components:
  schemas:
    APIStatementLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          readOnly: true
        amount:
          type: number
          multipleOf: 0.01
          maximum: 100000000000000
          minimum: -100000000000000
          readOnly: true
        foreign_amount:
          type: number
          multipleOf: 0.001
          maximum: 10000000000000
          minimum: -10000000000000
          readOnly: true
        foreign_currency_code:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        card:
