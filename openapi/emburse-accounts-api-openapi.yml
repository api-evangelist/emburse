          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            url:
              type: string
              readOnly: true
            amount:
              type: string
              readOnly: true
            state:
              type: string
              readOnly: true
            category:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  readOnly: true
                  maxLength: 255
                code:
                  type: string
                  readOnly: true
                  nullable: true
                  pattern: ^[0-9A-z\.\-]+$
                  maxLength: 36
                  minLength: 1
                parent:
                  type: object
                  properties: {}
                  readOnly: true
                is_archived:
                  type: boolean
                  readOnly: true
                created_at:
                  type: string
                  format: date-time
                  readOnly: true
                url:
                  type: string
                  readOnly: true
              required:
              - name
              - parent
              readOnly: true
              nullable: true
            department:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  readOnly: true
                  maxLength: 255
                code:
                  type: string
                  readOnly: true
                  nullable: true
                  pattern: ^[0-9A-z\.\-]+$
                  maxLength: 36
                  minLength: 1
                parent:
                  type: object
                  properties: {}
                  readOnly: true
                is_archived:
                  type: boolean
                  readOnly: true
                created_at:
                  type: string
                  format: date-time
                  readOnly: true
                url:
                  type: string
                  readOnly: true
              required:
              - name
              - parent
              readOnly: true
              nullable: true
            label:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  readOnly: true
                  maxLength: 255
                code:
                  type: string
                  readOnly: true
                  nullable: true
                  pattern: ^[0-9A-z\.\-]+$
                  maxLength: 36
                  minLength: 1
                parent:
                  type: object
                  properties: {}
                  readOnly: true
                is_archived:
                  type: boolean
                  readOnly: true
                created_at:
                  type: string
                  format: date-time
                  readOnly: true
                url:
                  type: string
                  readOnly: true
              required:
              - name
              - parent
              readOnly: true
              nullable: true
            location:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  readOnly: true
                  maxLength: 255
                code:
                  type: string
                  readOnly: true
                  nullable: true
                  pattern: ^[0-9A-z\.\-]+$
                  maxLength: 36
