components:
  schemas:
    _Segment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          nullable: true
          pattern: ^[0-9A-z\.\-]+$
          maxLength: 36
          minLength: 1
        parent:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              readOnly: true
              maxLength: 255
            code:
              type: string
              readOnly: true
              nullable: true
              pattern: ^[0-9A-z\.\-]+$
              maxLength: 36
              minLength: 1
            parent:
              type: object
              properties: {}
              readOnly: true
            is_archived:
              type: boolean
              readOnly: true
            created_at:
              type: string
              format: date-time
              readOnly: true
            url:
              type: string
              readOnly: true
          required:
          - name
          - parent
          nullable: true
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          readOnly: true
      required:
      - name
      - created_at
