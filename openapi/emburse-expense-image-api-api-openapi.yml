                  value: "<list>\n    <com.chromeriver.servlet.VoucherInvoiceTO>\n        <reportID>STAG01234567</reportID>\n        <voucherInvoice>0860631509020301</voucherInvoice>\n        <invoiceDate>1502752264000</invoiceDate>\n        <invoiceDateString>2017-08-14 23:11:04</invoiceDateString>\n        <vendorNumber>01234</vendorNumber>\n        <isReceiptUpdatedAfterExport>false</isReceiptUpdatedAfterExport>\n    </com.chromeriver.servlet.VoucherInvoiceTO>\n    <com.chromeriver.servlet.VoucherInvoiceTO>\n        <reportID>STAG12345678</reportID>\n        <voucherInvoice>0860631509020302</voucherInvoice>\n        <invoiceDate>1502752264000</invoiceDate>\n        <invoiceDateString>2017-08-14 23:11:04</invoiceDateString>\n        <vendorNumber>23456</vendorNumber>\n        <isReceiptUpdatedAfterExport>false</isReceiptUpdatedAfterExport>\n    </com.chromeriver.servlet.VoucherInvoiceTO>\n</list>\n"
        '400':
          description: Bad date input.
          content:
            text:
              examples:
                Unparseable date.:
                  description: Unparseable date.
                  value: Unparseable date. Date formats are MM/dd/yyyy or MM/dd/yyyy hh:mm:ss
                Range exceeds maximum days.:
                  description: Range exceeds maximum days.
                  value: Range of export dates requested exceeds maximum days supported (X calendar days). Please narrow export date range to X days or less and resubmit your request.
        '412':
