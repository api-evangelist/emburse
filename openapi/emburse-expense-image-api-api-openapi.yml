  /expense-image-api/getLineItemReceiptsFromLineItemId:
    get:
      tags:
      - expense-image-api
      summary: Extract PDF of receipts for a line item
      description: This method returns a Line Item Receipts PDF based on the given Line Item ID.
      operationId: getLineItemReceiptsFromLineItemId
      parameters:
      - name: expenseReportLineItemId
        in: query
        description: expenseReportLineItemId
        required: true
        schema:
          type: string
          default: ''
        example: 01670304-083d-4c6e-9c76-a5716987de7a
      - name: getPDFReport
        in: query
        description: If selected, the original PDF is retrieved first, if available.
        required: false
        schema:
          type: boolean
          default: false
      - name: getPDFReportWithNotes
        in: query
        description: If selected, the original PDF will include approval notes
        required: false
        schema:
          type: boolean
          default: false
      - name: imageFirst
        in: query
        description: If selected, the images will be retrieved before any PDFs
        required: false
        schema:
          type: boolean
          default: true
      - name: getMileageCoverPage
        in: query
        description: If selected, the mileage cover page will be included if the item type of the line item is of type mileage.
        required: false
        schema:
          type: boolean
          default: false
      - name: x-api-key
        $ref: '#/components/parameters/x-api-key'
      - name: chain-id
        $ref: '#/components/parameters/chain-id'
      - name: customer-code
        $ref: '#/components/parameters/customer-code'
      responses:
        '200':
          description: OK
          content:
            application/pdf: {}
        '400':
          description: Bad input.
          content:
            text:
              examples:
                expenseReportLineItemId is empty:
                  description: expenseReportLineItemId is empty
                  value: expenseReportLineItemId is empty
                Invalid expense report line item id:
                  description: Invalid expense report line item id
                  value: 'Invalid expense report line item id: {expenseReportLineItemId}. Cannot find expense report header for this line item in customer {customerId}'
                Invalid expense report line item id.:
                  description: Invalid expense report line item id.
                  value: 'Invalid expense report line item id: {expenseReportLineItemId}. Cannot find expense report line item in customer {customerId}'
                Problem generating images or pdf report.:
                  description: Problem generating images or pdf report.
                  value: 'getReceiptsFromLineItemId: problem streaming byte array for expense report line item: {expenseReportLineItemId}'
        '412':
          $ref: '#/components/responses/412'
components:
  parameters:
    customer-code:
      name: customer-code
      in: header
      description: Unique customer identifier provided by Chrome River
      required: true
      schema:
        type: string
    chain-id:
      name: chain-id
      in: header
      description: Reference used to track the flow of the request
      required: true
