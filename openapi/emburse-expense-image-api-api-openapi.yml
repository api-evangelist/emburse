openapi: 3.2.0
info:
  title: Expense Image API
  description: Documentation for service interacting with Emburse - Chrome River Expense Image.
  termsOfService: https://www.chromeriver.com/company/security
  contact:
    name: Chrome River Technologies
    url: https://www.chromeriver.com/contact
    email: info@chromeriver.com
  version: 1.46.0
servers:
- url: https://service.chromeriver.com
security:
- x-api-key: []
tags:
- name: expense-image-api
  description: Retrieve Expense Report Receipts / Images
paths:
  /expense-image-api/getVoucherInvoices:
    get:
      tags:
      - expense-image-api
      summary: Get voucher invoices for a given date range.
      description: Get voucher invoices for a given date range. Returns an xml file.
      operationId: getByDateRange
      parameters:
      - name: fromDate
        in: query
        description: Beginning of the date range. Date format can be MM/dd/yyyy or MM/dd/yyyy hh:mm:ss
        required: true
        schema:
          type: string
          default: ''
        example: 08/01/2017 or 08/01/2017 23:22:21
      - name: toDate
        in: query
        description: End of the date range. Date format can be MM/dd/yyyy or MM/dd/yyyy hh:mm:ss
        required: true
        schema:
          type: string
          default: ''
        example: 08/01/2017 or 08/01/2017 23:22:21
      - name: x-api-key
        $ref: '#/components/parameters/x-api-key'
      - name: chain-id
        $ref: '#/components/parameters/chain-id'
      - name: customer-code
        $ref: '#/components/parameters/customer-code'
      responses:
        '200':
          description: OK
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/VoucherInvoiceTO'
              examples:
                voucher invoice list:
                  description: voucher invoice list
                  value: "<list>\n    <com.chromeriver.servlet.VoucherInvoiceTO>\n        <reportID>STAG01234567</reportID>\n        <voucherInvoice>0860631509020301</voucherInvoice>\n        <invoiceDate>1502752264000</invoiceDate>\n        <invoiceDateString>2017-08-14 23:11:04</invoiceDateString>\n        <vendorNumber>01234</vendorNumber>\n        <isReceiptUpdatedAfterExport>false</isReceiptUpdatedAfterExport>\n    </com.chromeriver.servlet.VoucherInvoiceTO>\n    <com.chromeriver.servlet.VoucherInvoiceTO>\n        <reportID>STAG12345678</reportID>\n        <voucherInvoice>0860631509020302</voucherInvoice>\n        <invoiceDate>1502752264000</invoiceDate>\n        <invoiceDateString>2017-08-14 23:11:04</invoiceDateString>\n        <vendorNumber>23456</vendorNumber>\n        <isReceiptUpdatedAfterExport>false</isReceiptUpdatedAfterExport>\n    </com.chromeriver.servlet.VoucherInvoiceTO>\n</list>\n"
        '400':
          description: Bad date input.
          content:
            text:
              examples:
                Unparseable date.:
                  description: Unparseable date.
                  value: Unparseable date. Date formats are MM/dd/yyyy or MM/dd/yyyy hh:mm:ss
                Range exceeds maximum days.:
                  description: Range exceeds maximum days.
                  value: Range of export dates requested exceeds maximum days supported (X calendar days). Please narrow export date range to X days or less and resubmit your request.
        '412':
          $ref: '#/components/responses/412'
  /expense-image-api/getVoucherInvoicesForXML:
    get:
      tags:
      - expense-image-api
