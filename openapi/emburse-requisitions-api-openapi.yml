              format: uuid
            name:
              type: string
              readOnly: true
              maxLength: 255
            code:
              type: string
              readOnly: true
              nullable: true
              pattern: ^[0-9A-z\.\-]+$
              maxLength: 36
              minLength: 1
            parent:
              type: object
              properties: {}
              readOnly: true
            is_archived:
              type: boolean
              readOnly: true
            created_at:
              type: string
              format: date-time
              readOnly: true
            url:
              type: string
              readOnly: true
          required:
          - name
          - parent
          nullable: true
        description:
          type: string
          maxLength: 1000
        end_hour:
          type: integer
          maximum: 23
          nullable: true
          minimum: 0
        end_time:
          type: string
          format: date-time
          nullable: true
        id:
          type: string
          format: uuid
          readOnly: true
        interval:
