components:
  schemas:
    APIShippingAddress:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          readOnly: true
        address_1:
          type: string
          maxLength: 255
        address_2:
          type: string
          default: ''
        city:
          type: string
          maxLength: 255
        state:
          type: string
          maxLength: 255
        country:
          type: string
          default: US
          maxLength: 2
        postal_code:
          type: string
        zip_code:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_1
      - created_at
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth2 access token. Include in Authorization header: `Authorization: Bearer YOUR_ACCESS_TOKEN`'
