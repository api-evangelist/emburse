      - name: ordering
        in: query
        required: false
        description: Order results by field. Prefix with - for descending order.
        schema:
          type: string
          enum:
          - created_at
          - -created_at
          - time
          - -time
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITransaction'
          description: ''
        '400':
          description: Bad Request - Invalid arguments or malformed request
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '403':
          description: Forbidden - Insufficient permissions for this operation
        '404':
          description: Not Found - Resource does not exist
        '409':
          description: Conflict - Request conflicts with existing data
        '429':
          description: Too Many Requests - Rate limit exceeded
        '500':
          description: Internal Server Error
      tags:
      - Transactions
    put:
      operationId: put_transactions_by_id
      description: Always perform a partial update.
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      - name: card
        required: false
        in: query
        description: card
        schema:
          type: string
      - name: member
        required: false
        in: query
        description: member
        schema:
          type: string
      - name: category
        required: false
        in: query
        description: category
        schema:
          type: string
      - name: department
        required: false
        in: query
        description: department
        schema:
          type: string
      - name: location
        required: false
        in: query
        description: location
        schema:
          type: string
      - name: label
        required: false
        in: query
        description: label
        schema:
          type: string
      - name: before
        required: false
        in: query
        description: before
        schema:
          type: string
      - name: after
        required: false
