      - name: ordering
        in: query
        required: false
        description: Order results by field. Prefix with - for descending order.
        schema:
          type: string
          enum:
          - created_at
          - -created_at
          - time
          - -time
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITransaction'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITransaction'
          description: ''
        '400':
          description: Bad Request - Invalid arguments or malformed request
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '403':
          description: Forbidden - Insufficient permissions for this operation
        '404':
          description: Not Found - Resource does not exist
        '409':
          description: Conflict - Request conflicts with existing data
        '429':
          description: Too Many Requests - Rate limit exceeded
        '500':
          description: Internal Server Error
      tags:
      - Transactions
components:
  schemas:
    APITransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          readOnly: true
        amount:
          type: string
          readOnly: true
        currency_code:
          type:
          - string
          - 'null'
          readOnly: true
          maxLength: 4
        foreign_amount:
          type: string
          readOnly: true
        foreign_currency_code:
          type:
          - string
          - 'null'
          readOnly: true
          maxLength: 3
        state:
          type: string
          readOnly: true
        response_code:
          type: string
          readOnly: true
        merchant:
          type: string
          readOnly: true
        vendor:
          type: string
          readOnly: true
        bank_account:
          type: string
          readOnly: true
        card:
          type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            url:
              type: string
              readOnly: true
            state:
              type: string
              readOnly: true
            description:
              type: string
              readOnly: true
              maxLength: 255
            last_four:
              type: string
              readOnly: true
              pattern: ^[0-9]{4}$
              maxLength: 4
          required:
          - description
          - last_four
          readOnly: true
        is_online:
          type: boolean
          readOnly: true
        member:
          type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            url:
              type: string
              readOnly: true
            email:
              type: string
              readOnly: true
            code:
              type:
              - string
              - 'null'
              readOnly: true
              pattern: ^[0-9A-z\.\-]+$
              maxLength: 36
              minLength: 1
            first_name:
              type: string
              readOnly: true
              maxLength: 255
            last_name:
              type: string
              readOnly: true
              maxLength: 255
          required:
          - first_name
          - last_name
          readOnly: true
        category:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              readOnly: true
              maxLength: 255
            code:
              type:
              - string
              - 'null'
              readOnly: true
              pattern: ^[0-9A-z\.\-]+$
              maxLength: 36
              minLength: 1
            parent:
              type: object
              properties: {}
              readOnly: true
            is_archived:
              type: boolean
              readOnly: true
            created_at:
              type: string
              format: date-time
              readOnly: true
            url:
              type: string
              readOnly: true
          required:
          - name
          - parent
        department:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              readOnly: true
              maxLength: 255
            code:
              type:
              - string
              - 'null'
              readOnly: true
              pattern: ^[0-9A-z\.\-]+$
              maxLength: 36
              minLength: 1
            parent:
              type: object
              properties: {}
              readOnly: true
            is_archived:
              type: boolean
              readOnly: true
            created_at:
              type: string
              format: date-time
              readOnly: true
            url:
              type: string
              readOnly: true
          required:
          - name
          - parent
        label:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              readOnly: true
              maxLength: 255
            code:
              type:
              - string
              - 'null'
              readOnly: true
              pattern: ^[0-9A-z\.\-]+$
              maxLength: 36
              minLength: 1
            parent:
              type: object
              properties: {}
              readOnly: true
            is_archived:
              type: boolean
              readOnly: true
            created_at:
              type: string
              format: date-time
              readOnly: true
            url:
              type: string
              readOnly: true
          required:
          - name
          - parent
        location:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              readOnly: true
              maxLength: 255
            code:
              type:
              - string
              - 'null'
              readOnly: true
              pattern: ^[0-9A-z\.\-]+$
              maxLength: 36
              minLength: 1
            parent:
              type: object
              properties: {}
              readOnly: true
            is_archived:
              type: boolean
              readOnly: true
            created_at:
              type: string
              format: date-time
              readOnly: true
            url:
              type: string
              readOnly: true
          required:
          - name
          - parent
        note:
          type: string
          maxLength: 1000
        receipt:
          type: string
          readOnly: true
        attachments:
          type: string
          readOnly: true
        time:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        posted_at:
          type: string
          format: date-time
          readOnly: true
        review_status:
          enum:
          - pending
          - approved
          - denied
          - out_of_policy
          - exempt
          type:
          - string
          - 'null'
          readOnly: true
        requisition:
          type:
          - string
          - 'null'
          readOnly: true
        type:
          type: string
          readOnly: true
        purchase_details:
          type: object
          readOnly: true
      required:
      - time
      - created_at
      - posted_at
      - purchase_details
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth2 access token. Include in Authorization header: `Authorization: Bearer YOUR_ACCESS_TOKEN`'
