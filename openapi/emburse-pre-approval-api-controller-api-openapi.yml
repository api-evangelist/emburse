      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Customer Code is invalid
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Customer Code is not authorized.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Logged in user does not exist.
          content:
            application/json:
              schema:
                type: object
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                type: object
  /v1/preapproval-reports/{reportId}:
    delete:
      tags:
      - pre-approval-api-controller
      summary: Delete a pre-approval
      description: This web service allows an external application to delete a pre-approval
      operationId: deletePreApproval
      parameters:
      - name: reportId
        in: path
        description: Report ID for pre-approval
        required: true
        schema:
          type: string
      - name: chain-id
        in: header
        description: Used for tracking the flow of the request
        required: true
        schema:
          type: string
      - name: expense-owner-id
        in: header
        description: Unique ID of the expense-owner
        required: true
        schema:
          type: string
      - name: x-api-key
        in: header
        description: API key for Authentication
        required: true
        schema:
          type: string
      - name: customer-code
        in: header
        description: Unique customer identifier provided by Chrome River
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Delete successful
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Customer Code is invalid
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Customer Code is not authorized
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Forbidden operation
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Pre-Approval does not exist
          content:
            application/json:
              schema:
                type: object
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                type: object
