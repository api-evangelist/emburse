            default: false
        - name: imageFirst
          in: query
          description: Flag to indicate if image should be retrieved first
          required: false
          allowEmptyValue: false
          example: false
          schema:
            type: boolean
            default: false
        - name: includeCollections
          in: query
          description: List of collections to include in the report
          required: false
          allowEmptyValue: false
          explode: true
          schema:
            type: array
            items:
              type: string
            enum:
              - HEADER_COMPLIANCE_ITEMS
              - HEADER_IMAGES
              - LINE_ITEMS
              - HEADER_NOTES
              - HEADER_UDAS
              - LINE_ITEM_MATTERS
              - LINE_ITEM_COMPLIANCE_ITEMS
              - LINE_ITEM_IMAGES
              - LINE_ITEM_CHILDREN
              - LINE_ITEM_NOTES
              - LINE_ITEM_UDAS
              - LINE_ITEM_TRIPS
              - LINE_ITEM_STEPS
              - HEADER_PAYMENT_ACCOUNT
        - name: limit
          in: query
          description: Maximum number of results to return. If no value is passed, it will
            be taken from the configurable property file, where this value is
            equal to 10 by default
          required: false
          schema:
            type: ref
        - name: offset
          in: query
          description: The (zero-based) offset of the first item returned in the
            collection. If no value is passed, it will be taken from the
            configurable property file, where this value is equal to 10 by
            default. This value is limited to 100 to ensure reasonable use of
            system resources.
          required: false
          schema:
            type: ref
        - name: ownerCountryAlpha2
          in: query
          description: Reports owner countryAlpha2
          required: false
          allowEmptyValue: false
          example: US
          schema:
            type: string
        - name: ownerEmailAddress
          in: query
          description: Unique email of the expense owner making a request
          required: false
          allowEmptyValue: false
          example: emailAddress@gmail.com
          schema:
            type: string
        - name: ownerUniqueId
          in: query
          description: Unique ID of the expense owner making a request
          required: false
          allowEmptyValue: false
          example: personUniqueId
          schema:
            type: string
        - name: ownerUserName
          in: query
          description: Unique user-name of the expense owner making a request
          required: false
          allowEmptyValue: false
          example: userName
          schema:
            type: string
        - name: reportStatus
          in: query
          description: Filter by report status
          required: false
          allowEmptyValue: false
          example: Returned
          schema:
            type: string
            enum:
              - Draft
              - Pending Approval
              - Approved
              - Returned
              - Exported
              - Paid
              - Partially Paid
              - Deleted
        - name: submitDate
          in: query
          description: Filter by reports submitted this date (yyyy-MM-dd)
          required: false
          allowEmptyValue: false
          example: 2021-03-21
          schema:
            type: string
            format: date-time
        - name: voucherInvoice
          in: query
          description: Voucher Invoice parameter
          required: false
          allowEmptyValue: false
          schema:
            type: string
        - name: x-api-key
          in: header
          description: API key for Authentication
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseReportV3"
        "400":
          description: Customer Code is invalid.
        "401":
          description: Customer Code is not authorized. Cannot get list of expense reports.
        "403":
          description: Logged in user does not exist.
        "503":
          description: Service unavailable.
      deprecated: false
