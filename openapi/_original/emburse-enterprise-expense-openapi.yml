        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: exportDate
          in: query
          description: Filter by reports exported this date (yyyy-MM-dd)
          required: false
          allowEmptyValue: false
          example: 2021-03-21
          schema:
            type: string
            format: date-time
        - name: getPDFReport
          in: query
