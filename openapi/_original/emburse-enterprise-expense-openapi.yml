openapi: 3.0.0
info:
  description: Api Documentation
  version: "1.0"
  title: Api Documentation
  termsOfService: urn:tos
  contact: {}
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
tags:
  - name: expense-controller-v3
    description: Retrieve expense reports by filter(s)
  - name: expense-controller-v1
    description: Retrieve expense report information and create draft expense reports
  - name: expense-approval-controller-v2
    description: Approve, return and reassign expense reports using username or
      email of approver.
  - name: expense-approval-controller-v1
    description: Approve, return and reassign expense reports.
  - name: expense-receipts-controller
    description: Retrieve expense receipt PDF
  - name: expense-types-controller
    description: Retrieve expense type information
  - name: expense-report-line-item-controller
    description: Retrieve expense report line items
  - name: returned-payments-controller
    description: Retrieve information concerning returned payments
paths:
  "/v1/expense-receipts/{reportId}":
    get:
      tags:
        - expense-receipts-controller
      summary: Retrieve an expense receipt PDF
      description: This web service allows an external application to fetch a receipt PDF.
      operationId: getExpenseReceiptsUsingGET
      parameters:
        - name: customer-id
          in: header
          description: customer-id
          required: true
          schema:
            type: integer
            format: int32
        - name: person-id
          in: header
          description: person-id
          required: true
          schema:
            type: integer
            format: int32
        - name: reportId
          in: path
          description: reportId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: byte
      deprecated: false
  /v1/expense-report-approvals:
    get:
      tags:
        - expense-approval-controller-v1
      summary: Get list of reports for approval
      description: This web service allows an external application to get a list of
        expense reports awaiting approval by a user
      operationId: getApprovalsUsingGET
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID of the approver logged in making request
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseReport"
        "400":
          description: Customer Code is invalid.
        "401":
          description: Customer Code is not authorized.  Cannot get list of expense
            reports for approval.
        "403":
          description: Logged in user does not exist.
        "503":
          description: Service unavailable.
      deprecated: false
  /v1/expense-report-approvals/count:
    get:
      tags:
        - expense-approval-controller-v1
      summary: Get count of reports for approval
      description: This web service allows an external application to a count of
        expense reports awaiting approval by a user.
      operationId: getExpenseReportCountUsingGET
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID of the approver logged in making request
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountModel"
        "400":
          description: Customer Code is invalid
        "401":
          description: Customer Code is not authorized.  Cannot get expense report count.
        "403":
          description: Logged in user does not exist.
        "503":
          description: Service unavailable.
      deprecated: false
  "/v1/expense-report-approvals/{reportId}":
    get:
      tags:
        - expense-approval-controller-v1
      summary: Get expense report details
      description: This web service allows an external application to get the details
        of an expense report
      operationId: getExpenseReportUsingGET
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID of the approver logged in making request
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          description: Report ID for report
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseReport"
        "400":
          description: Customer Code is invalid.
        "401":
          description: Customer Code is not authorized.  Cannot get expense report.
        "403":
          description: Logged in user is not allowed to view details expense report or
            Logged in user does not exist
        "404":
          description: Expense Report does not exist.
        "503":
          description: Service unavailable.
      deprecated: false
  "/v1/expense-report-approvals/{reportId}/submit":
    post:
      tags:
        - expense-approval-controller-v1
      summary: Submit an expense report for approval
      description: This web service allows an external application to submit the
        specified expense report for approval
      operationId: submitExpenseReportForApprovalUsingPOST
      parameters:
        - name: approver-id
          in: header
          description: Unique ID of the approver who currently has the report and wants to
            submit it further
          required: true
          schema:
            type: string
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          description: Report ID for report
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/ExpenseSubmit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseSubmitResponse"
        "400":
          description: Required query parameters are missing or invalid
        "422":
          description: Expense report has not been submitted. Report have some business
            rules violations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseSubmitResponse"
        "503":
          description: Service unavailable.
      deprecated: false
  /v1/expense-report-line-item-search:
    get:
      tags:
        - expense-report-line-item-controller
      summary: getLineItems
      operationId: getLineItemsUsingGET_1
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: createDate
          in: query
          description: Filter by line item created this date (yyyy-MM-dd)
          required: false
          allowEmptyValue: false
          example: 2021-04-21
          schema:
            type: string
            format: date-time
        - name: expenseReportHeaderIds
          in: query
          description: Filter to only include line items that belong to a list of
            comma-separated list of expense report header IDs
          required: false
          allowEmptyValue: false
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: exportDate
          in: query
          description: Filter by line item exported this date (yyyy-MM-dd)
          required: false
          allowEmptyValue: false
          example: 2021-04-21
          schema:
            type: string
            format: date-time
        - name: hasComplianceItems
          in: query
          description: Filter by whether a line item has compliance items
          required: false
          allowEmptyValue: false
          schema:
            type: boolean
            enum:
              - "true"
              - "false"
        - name: includeMergedTransactions
          in: query
          description: Return child transactions in the expenseTransaction data (for merge
            sets)
          required: false
          allowEmptyValue: false
          schema:
            type: boolean
            enum:
              - "true"
              - "false"
        - name: isCreatedByAces
          in: query
          description: Filter by whether a line item was created by the ACES (Accelerated
            Expense Service)
          required: false
          allowEmptyValue: false
          schema:
            type: boolean
            enum:
              - "true"
              - "false"
        - name: lineItemStatus
          in: query
          description: Filter by line item status
          required: false
          allowEmptyValue: false
          example: Returned
          schema:
            type: string
            enum:
              - Draft
              - Pending Approval
              - Approved
              - Returned
              - Exported
              - Paid
        - name: reportId
          in: query
          description: Filter by line item's header report ID
          required: false
          allowEmptyValue: false
          example: DEV028700864
          schema:
            type: string
        - name: submitDate
          in: query
          description: Filter by line item submitted this date (yyyy-MM-dd)
          required: false
          allowEmptyValue: false
          example: 2021-04-21
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseReportLineItemV3"
      deprecated: false
  /v1/expense-reports:
    get:
      tags:
        - expense-controller-v1
      summary: Get list of reports summary by expense owner
      description: This web service allows an external application to fetch a list of
        report summaries by owner. This excludes deleted reports of the owner
      operationId: getExpenseReportsUsingGET
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: expenseOwnerId
          in: query
          description: Unique ID for the owner of the expense report. Either
            expenseOwnerId or (header) logged-in-user-id is required.
          required: false
          allowEmptyValue: false
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: logged-in-user-id
          required: false
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseReport"
        "400":
          description: Customer Code is invalid
        "401":
          description: Customer Code is not authorized.
        "403":
          description: Logged in user does not exist.
        "503":
          description: Service unavailable.
      deprecated: false
    post:
      tags:
        - expense-controller-v1
      summary: Create a draft expense report
      description: This web service allows an external application to create a draft
        expense report.
      operationId: createExpenseReportUsingPOST
      parameters:
        - name: chain-id
          in: header
          description: Reference used to track the flow of the request
          required: false
          schema:
            type: string
        - name: creator-user-id
          in: header
          description: Unique ID of expense creator
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID of expense owner
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseReportHeaderCreateModel"
        description: Expense report to create
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Customer Code is invalid.
        "401":
          description: Customer Code is not authorized. Cannot create expense report.
        "402":
          description: Expense draft report cannot be created.
        "503":
          description: Service unavailable.
      deprecated: false
  "/v1/expense-reports/{report-id}/line-items/{report-line-item-id}/approve":
    post:
      tags:
        - expense-approval-controller-v1
      summary: Approve an expense report line item
      description: This web service allows an external application to approve the
        specified expense report line item.
      operationId: approveExpenseReportLineItemUsingPOST
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID for the approver logged in making request
          required: true
          schema:
            type: string
        - name: report-id
          in: path
          description: Report ID for report
          required: true
          schema:
            type: string
        - name: report-line-item-id
          in: path
          description: Report Line Item ID for report
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotesModel"
        description: Optional note tied to Line Item Approval
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Customer Code is invalid.
        "401":
          description: Customer Code is not authorized.  Cannot approve expense report
            line item.
        "403":
          description: Logged in user is not authorized to approve line item or Logged in
            user does not exist.
        "503":
          description: Service unavailable.
      deprecated: false
  "/v1/expense-reports/{report-id}/line-items/{report-line-item-id}/reassign":
    post:
      tags:
        - expense-approval-controller-v1
      summary: Reassign an expense report line item
      description: This web service allows an external application to reassign the
        specified expense report line item to another approver for review
      operationId: reassignExpenseReportLineItemUsingPOST
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID for the approver logged in making request
          required: true
          schema:
            type: string
        - name: report-id
          in: path
          description: Report ID for report
          required: true
          schema:
            type: string
        - name: report-line-item-id
          in: path
          description: Report Line Item ID for report
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/ReassignModelV1"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Customer Code is invalid.
        "401":
          description: Customer Code is not authorized.  Cannot reassign expense report
            line item.
        "403":
          description: Logged in user is not authorized to reassign report line item or
            Logged in user does not exist.
        "503":
          description: Service unavailable.
      deprecated: false
  "/v1/expense-reports/{report-id}/line-items/{report-line-item-id}/return":
    post:
      tags:
        - expense-approval-controller-v1
      summary: Return an expense report line item
      description: This web service allows an external application to return the
        specified expense report line item.
      operationId: returnExpenseReportLineItemUsingPOST
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID for the approver logged in making request
          required: true
          schema:
            type: string
        - name: report-id
          in: path
          description: Report ID for report
          required: true
          schema:
            type: string
        - name: report-line-item-id
          in: path
          description: Report Line Item ID for report
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotesModel"
        description: Note tied to Line Item Return
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Customer Code is invalid.
        "401":
          description: Customer Code is not authorized.  Cannot return expense report line
            item.
        "403":
          description: Logged in user is not authorized to return report or Logged in user
            does not exist.
        "503":
          description: Service unavailable.
      deprecated: false
  "/v1/expense-reports/{reportId}":
    get:
      tags:
        - expense-controller-v1
      summary: Get details of report
      description: This web service allows an external application to fetch details of
        a report.
      operationId: getExpenseReportUsingGET_2
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request.
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River.
          required: true
          schema:
            type: string
        - name: expenseOwnerId
          in: query
          description: Unique ID for the owner of the expense report.
          required: true
          allowEmptyValue: false
          schema:
            type: string
        - name: reportId
          in: path
          description: Identifier for the expense report.
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: API key for Authentication.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseReport"
        "400":
          description: Customer Code is invalid.
        "401":
          description: Customer Code is not authorized.
        "403":
          description: Expense owner does not exist.
        "503":
          description: Service unavailable.
      deprecated: false
    delete:
      tags:
        - expense-approval-controller-v1
      summary: Delete an expense report
      description: This web service allows an external application to delete the
        specified expense report
      operationId: deleteExpenseReportUsingDELETE
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID for the submitter logged in making request
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          description: Report ID for report
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content. Expense report successfully deleted
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Customer Code is not authorized.  Cannot delete expense report.
        "403":
          description: Logged in user is not authorized to delete report or Logged in user
            does not exist.
        "404":
          description: Expense report not found
        "503":
          description: Service unavailable.
      deprecated: false
  "/v1/expense-reports/{reportId}/approve":
    post:
      tags:
        - expense-approval-controller-v1
      summary: Approve an expense report
      description: This web service allows an external application to approve the
        specified expense report
      operationId: approveExpenseReportUsingPOST
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID for the approver logged in making request
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          description: Report ID for report
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/NotesModel2"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Customer Code is invalid.
        "401":
          description: Customer Code is not authorized.  Cannot approve expense report.
        "403":
          description: Logged in user is not authorized to approve report or Logged in
            user does not exist.
        "503":
          description: Service unavailable.
      deprecated: false
  "/v1/expense-reports/{reportId}/line-items":
    delete:
      tags:
        - expense-controller-v1
      summary: Delete an expense report line item
      description: This web service allows an external application to delete the
        specified expense report line item.
      operationId: deleteExpenseReportLineItemUsingDELETE
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: externalTransactionId
          in: query
          description: External transaction ID for transaction
          required: true
          allowEmptyValue: false
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID for the user logged in making request
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          description: Report ID for report
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: "API key for Authentication "
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content. Item successfully deleted
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Cannot delete line item for expense report in this status
        "401":
          description: Customer Code is not authorized.  Cannot submit expense report.
        "403":
          description: Logged in user is not authorized to delete item or Logged in user
            does not exist.
        "404":
          description: Expense report line item does not exist for this report
        "503":
          description: Service unavailable.
      deprecated: false
  "/v1/expense-reports/{reportId}/notes":
    post:
      tags:
        - expense-controller-v1
      summary: Add a note to an expense report
      description: This web service allows an external application to add a note to an
        expense report.
      operationId: createExpenseHeaderNoteUsingPOST
      parameters:
        - name: chain-id
          in: header
          description: Reference used to track the flow of the request
          required: false
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID of the user logged in making request
          required: false
          schema:
            type: string
        - name: reportId
          in: path
          description: reportId
          required: true
          schema:
            type: string
        - name: x-api-key
