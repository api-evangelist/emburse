components:
  schemas:
    APIAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        number:
          type: string
          readOnly: true
        ledger_balance:
          type: number
          multipleOf: 0.01
          maximum: 100000000000000
          minimum: -100000000000000
          readOnly: true
        available_balance:
          type: number
          multipleOf: 0.01
          maximum: 100000000000000
          minimum: -100000000000000
          readOnly: true
        currency_code:
          type: string
          readOnly: true
        minimum_balance:
          type: string
          readOnly: true
        available_credit:
          type: string
          readOnly: true
        pending_credits:
          type: number
          multipleOf: 0.01
          maximum: 100000000000000
          minimum: -100000000000000
          readOnly: true
        credit_limit:
          type: number
          multipleOf: 0.01
          maximum: 100000000000000
          minimum: -100000000000000
          readOnly: true
        funding_source:
          type: object
          properties:
            description:
              type: string
              readOnly: true
              maxLength: 255
            name:
              type: string
              readOnly: true
              maxLength: 255
            number:
              type: string
              readOnly: true
            is_verified:
              type: boolean
              readOnly: true
          required:
          - description
          - name
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - currency_code
      - funding_source
      - created_at
    APIAllowance:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          readOnly: true
        interval:
          type: string
          nullable: true
        amount:
          type: number
          multipleOf: 0.01
          maximum: 100000000000000
          minimum: 0.0
        transaction_limit:
          type: number
          multipleOf: 0.01
          maximum: 100000000000000
          minimum: 0.0
          nullable: true
        daily_limit:
          type: number
          multipleOf: 0.01
          maximum: 100000000000000
          minimum: 0.01
          nullable: true
        single_use:
          type: boolean
        start_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true
        scope:
          type: array
          items:
            type: integer
            maximum: 9223372036854775807
            minimum: 1
            format: int64
          maxItems: 10
        balance:
          type: number
          multipleOf: 0.01
          maximum: 100000000000000
          minimum: -100000000000000
          readOnly: true
        reset:
          type: boolean
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        increment:
          type: number
          multipleOf: 0.01
          maximum: 100000000000000
          minimum: 0.0
          writeOnly: true
      required:
      - balance
      - created_at
    APICard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          readOnly: true
        description:
          type: string
        name:
          type: string
          readOnly: true
        product:
