          required: true
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created
          headers:
            export-id:
              description: Export ID
              style: simple
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Customer Code is invalid.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Customer Code is not authorized.
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                type: object
  "/v1/preapproval-exports/{exportId}/close-export-request":
    post:
      tags:
        - pre-approval-api-export-controller
      summary: Complete PreApproval Export for a customer
      description: This web service allows an external application to complete a
