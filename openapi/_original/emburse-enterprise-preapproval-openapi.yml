      operationId: completePreApprovalExport
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: true
          schema:
            type: string
        - name: file-name
          in: header
          description: The export file name to be assigned to export
          required: false
          schema:
            type: string
        - name: exportId
