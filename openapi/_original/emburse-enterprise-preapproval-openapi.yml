      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: true
          schema:
            type: string
        - name: exportId
          in: path
          description: Export ID to be completed
          required: true
          schema:
            type: string
        - name: page-size
          in: query
          description: Used to get the number of PreApprovals per page. Defaults to all
