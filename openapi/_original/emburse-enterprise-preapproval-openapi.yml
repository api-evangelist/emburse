          schema:
            type: string
        - name: x-api-key
          in: header
          description: API key for Authentication
          required: true
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Customer Code is invalid.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Customer Code is not authorized.
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Logged in user is not authorized to approve report or Logged in
