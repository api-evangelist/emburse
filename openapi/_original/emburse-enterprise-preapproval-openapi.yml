openapi: 3.0.1
info:
  title: PreApproval API Documentation
  description: API for managing pre-approval reports and workflows
  contact:
    name: Chrome River Technologies
    url: https://www.chromeriver.com/contact
    email: info@chromeriver.com
  version: v1.0
servers:
  - url: https://service.chromeriver.com
    description: PreApproval API Development Server
paths:
  "/v2/preapproval-reports/{reportId}/notes":
    post:
      tags:
        - pre-approval-api-controller-v-2
      summary: Add note to a Pre-Approval Report
      description: This web service allows an external application to add a note to a
        Pre-Approval Report
      operationId: addNote
      parameters:
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          description: Report ID for pre-approval report
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID for the approver logged in making request
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: API key for Authentication
          required: true
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreApprovalNoteTO"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreApprovalNoteTO"
        "400":
          description: Customer Code is invalid.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Customer Code is not authorized. Cannot add comment to Pre-Approval
            Report.
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Logged in user does not exist
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Pre-Approval Report does not exist.
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                type: object
  /v1/preapproval-reports:
    post:
      tags:
        - pre-approval-import-controller
      summary: Create a draft/approved PreApproval report
      description: This service allows an external application to create a
        pre-approval report in DRAFT/APPROVED status
      operationId: createPreApproval
      parameters:
        - name: chain-id
          in: header
          description: Reference used to track the flow of the request
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: API key for Authentication
          required: true
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
      responses:
        "201":
          description: PreApproval report created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreApprovalImportOutput"
        "400":
          description: Customer Code is invalid. / Unprocessable input payload.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Customer Code is not authorized.
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                type: object
  "/v1/preapproval-reports/{reportId}/return":
    post:
      tags:
        - pre-approval-api-controller
      summary: Return a pre-approval report
      description: This web service allows an external application to return the
        specified pre-approval report to the expense owner
      operationId: returnPreApproval
      parameters:
        - name: reportId
          in: path
          description: Report ID for report
          required: true
          schema:
            type: string
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID for the approver logged in making request
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: API key for Authentication
          required: true
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Customer Code is invalid.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Customer Code is not authorized.
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Logged in user is not authorized to return report or Logged in user
            does not exist.
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                type: object
  "/v1/preapproval-reports/{reportId}/reassign":
    post:
      tags:
        - pre-approval-api-controller
      summary: Reassign a pre-approval report
      description: This web service allows an external application to reassign a
        specified pre-approval report to another approver for review
      operationId: reassignPreApproval
      parameters:
        - name: reportId
          in: path
          description: Report ID for report
          required: true
          schema:
            type: string
        - name: chain-id
          in: header
          description: Used for tracking the flow of the request
          required: true
          schema:
            type: string
        - name: logged-in-user-id
          in: header
          description: Unique ID for the approver logged in making request
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          description: API key for Authentication
          required: true
          schema:
            type: string
        - name: customer-code
          in: header
          description: Unique customer identifier provided by Chrome River
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Customer Code is invalid.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Customer Code is not authorized.  Cannot reassign PreApproval report.
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Logged in user is not authorized to reassign PreApproval or Logged
            in user does not exist.
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                type: object
  "/v1/preapproval-reports/{reportId}/approve":
    post:
      tags:
        - pre-approval-api-controller
      summary: Approve a pre-approval report
      description: This web service allows an external application to approve the
