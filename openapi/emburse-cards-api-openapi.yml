  /cards/{id}/pan:
    get:
      operationId: get_cards_by_id_pan
      description: APICardPAN model requires "has_pan_access" privileges.
      parameters:
      - name: id
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APICardPAN'
          description: ''
        '400':
