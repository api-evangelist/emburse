      - name: state
        required: false
        in: query
        description: 'Filter by card state. Accepts a comma-separated list of states. Valid values: active, unactivated, suspended, terminated.'
        schema:
          type: string
          example: active,suspended
        example: active,suspended
      - name: description
        required: false
        in: query
        description: description
        schema:
          type: string
      - name: created_before
        required: false
        in: query
        description: created_before
